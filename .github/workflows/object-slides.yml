name: Object slides experiment

on:
  push:
    branches: [experiment/object-slides]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@v1.20.0
        with:
          node-version: "24"
          cache: true
      - run: vp install
      - run: vp -C packages/suraido pack
      - run: vp -C packages/atom pack
      - run: vp -C packages/cli pack
      - run: vp -C packages/suraido check --fix
      - run: vp test
